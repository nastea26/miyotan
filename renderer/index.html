<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miyotan</title>
    <link rel="stylesheet" href="./styles/tailwind.out.css">
    <script src="js/main.js" defer></script>
</head>
<body class=" bg-gray-950 select-none" >
    <div class="p-0 mt-3 flex justify-center"> 
        <span class="w-100 text-center text-3xl text-cyan-700 border-b-gray-500 border-b p-1" > MIYOTAN SETTINGS </span>
    </div>
    
    <div class="nav flex-col fixed">
        <a href="#general"><div class="flex p-0 mt-1 mr-5 ml-6 text-2xl text-cyan-200 hover:cursor-pointer hover:text-cyan-100 transition duration-300 hover-el"> General </div></a>
        <a href="#dictionaries"><div class="flex p-0 mt-5 mr-5 ml-6 text-2xl text-cyan-200 hover:cursor-pointer hover:text-cyan-100 transition duration-300 hover-el"> Dictionaries </div></a>
        <a href="#keybinds"><div class="flex p-0 mt-5 mr-5 ml-6 text-2xl text-cyan-200 hover:cursor-pointer hover:text-cyan-100 transition duration-300 hover-el"> Keybinds </div></a>
        <a href="#anki"><div class="flex p-0 mt-5 mr-5 ml-6 text-2xl text-cyan-200 hover:cursor-pointer hover:text-cyan-100 transition duration-300 hover-el"> Anki </div></a>
    </div>
    <div class="settings max-w-1/2 h-fit ml-auto mr-auto mt-3">

         <!-- ### GENERAL ### -->
        <div class="category general-settings max-w-full h-fit" id = "general">
            <div class="category-title flex justify-start">
                <span class=" flex justify-items-start m-3 text-2xl text-cyan-200"> General </span>
            </div>
            <div class="category-content-wrapper max-w-full h-fit bg-gray-900">

                <div class="row p-2 flex justify-between" >
                    <span class="text-1xl p-1 text-gray-300" > Enable Miyotan </span>
                    <div class="enable-miyotan-slider mt-1 mb-1 relative w-11 h-5">
                        <input type="checkbox" id="enable-miyotan" data-setting="enabled" class="settings-el enable-miyotan peer appearance-none w-11 h-5 bg-gray-500 rounded-full checked:bg-cyan-600 cursor-pointer transition-colors duration-300" />
                        <label for="enable-miyotan" class="absolute top-0 left-0 w-5 h-5 bg-white rounded-full border border-slate-300 shadow-sm transition-transform duration-300 peer-checked:translate-x-6 peer-checked:border-cyan-600 cursor-pointer">
                        </label>
                    </div>
                </div>

                <div class="row p-2 flex justify-between" >
                    <span class="text-1xl p-1 text-gray-300" > Launch on start-up</span>
                    <div class="launch-on-startup-slider mt-1 mb-1 relative w-11 h-5">
                        <input type="checkbox" id="launch-on-startup" data-setting="launchOnStartup" class="settings-el launch-on-startup peer appearance-none w-11 h-5 bg-gray-500 rounded-full checked:bg-cyan-600 cursor-pointer transition-colors duration-300" />
                        <label for="launch-on-startup" class="absolute top-0 left-0 w-5 h-5 bg-white rounded-full border border-slate-300 shadow-sm transition-transform duration-300 peer-checked:translate-x-6 peer-checked:border-cyan-600 cursor-pointer">
                        </label>
                    </div>
                </div>

                <div class="row p-2 flex justify-between" >
                    <span class="text-1xl p-1 text-gray-300" > Language (ocr capture) </span>
                    <div class="ocr-language-wrapper">
                    <select id="ocr-language-select" name="ocr-language" data-setting="ocr.language" class="settings-el min-w-45 max-w-50 py-1 bg-gray-800 text-gray-200 rounded-md border border-cyan-600 focus:outline-none focus:ring-2 focus:ring-cyan-500 transition-all hover:text-cyan-200 duration-300">
                        <option value="ja"> Japanese </option>
                        <option value="en"disabled> Under Construction </option>
                    </select>
                    </div>
                </div>

            </div>
        </div>

        <!-- ### DICTIONARIES ### -->
        <div class="category dictionaries-settings max-w-full h-fit mt-5" id = "dictionaries">
            <div class="category-title flex justify-start">
                <span class=" flex justify-items-start m-3 text-2xl text-cyan-200"> Dictionaries </span>
            </div>
            <div class="category-content-wrapper max-w-full h-fit bg-gray-900">
                
            </div>

        </div>
        
        <!-- ### KEYBINDS ### -->
        <div class="category keybinds-settings max-w-full h-fit" id = "keybinds">
            <div class="category-title flex justify-start">
                <span class=" flex justify-items-start m-3 text-2xl text-cyan-200"> Keybinds </span>
            </div>
            <div class="category-content-wrapper max-w-full h-fit bg-gray-900">

                <div class="row p-2 flex justify-between" >
                    <span class="text-1xl p-1 text-gray-300" > OCR start selection </span>
                    <div class="keybind-ocr mt-2 mb-2">
                        <span id="ocr-keybind" data-setting="hotkeys.selection" class="keybind-el settings-el bg-gray-800 pt-2 pb-2 pr-4 pl-4 rounded-lg text-gray-200 border border-cyan-600 hover:cursor-pointer hover:text-cyan-200 transition-all duration-300"></span>
                    </div>
                </div>

                <div class="row p-2 flex justify-between" >
                    <span class="text-1xl p-1 text-gray-300" > Cancel/Close </span>
                    <div class="keybind-cancel mt-2 mb-2">
                        <span id="cancel-keybind" data-setting="hotkeys.cancel" class="keybind-el settings-el bg-gray-800 pt-2 pb-2 pr-4 pl-4 rounded-lg text-gray-200 border border-cyan-600 hover:cursor-pointer hover:text-cyan-200 transition-all duration-300"></span>
                    </div>
                </div>

            </div>
        </div>

    </div>
</body>
</html>
